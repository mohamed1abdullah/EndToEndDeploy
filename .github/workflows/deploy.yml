name: CI/CD - Build & Terraform Deploy

on:
  push:
    branches: [ "test", "main" ]

env:
  # --- 1. CREDENTIALS FOR TERRAFORM INIT (BACKEND S3) ---
  # Terraform automatically looks for these exact names to talk to AWS S3
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: 'us-east-1'

  # --- 2. CREDENTIALS FOR YOUR CODE (variables.tf) ---
  # These pass the keys into your Terraform variables so deploy.tf can use them
  TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # --- JOB 1: BUILD & PUSH DOCKER IMAGES ---
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # BACKEND
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./application/backend
          file: ./application/backend/Dockerfile
          push: true
          tags: mohamed010/backend-login:latest

      # FRONTEND
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./application/frontend
          file: ./application/frontend/Dockerfile
          push: true
          tags: mohamed010/frontend-login:latest

  # --- JOB 2: DEPLOY INFRASTRUCTURE (TERRAFORM) ---
  terraform-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./application/terrafrom

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        # This will now work because AWS_ACCESS_KEY_ID is set in 'env' above
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Upload SSH Key
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key
          path: application/terrafrom/ssh-key.pem