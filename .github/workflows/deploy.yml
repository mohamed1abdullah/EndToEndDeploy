name: CI/CD - Build and Refresh ASG

on:
  push:
    branches: [ "main", "feature/infrastructure-update" ] # Trigger on your branches

permissions:
  id-token: write
  contents: read

jobs:
  # --- JOB 1: GET CONFIGURATION ---
  get-config:
    runs-on: ubuntu-latest
    outputs:
      alb_url: ${{ steps.get_alb.outputs.dns }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Load Balancer URL
        id: get_alb
        run: |
          # Fetch the DNS name of the Load Balancer named 'restaurant-app-lb'
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names restaurant-app-lb \
            --query "LoadBalancers[0].DNSName" \
            --output text)
          echo "Found ALB: $ALB_DNS"
          echo "dns=http://$ALB_DNS" >> $GITHUB_OUTPUT

  # --- JOB 2: BUILD & PUSH ---
  build-and-push:
    needs: get-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Inject the Load Balancer URL into the Frontend Code
      - name: Update Frontend API URL
        run: |
          echo "Injecting API URL: ${{ needs.get-config.outputs.alb_url }}"
          sed -i "s|__API_URL_PLACEHOLDER__|${{ needs.get-config.outputs.alb_url }}|g" EndToEndDeploy/application/frontend/app.js

      # 2. Build Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: EndToEndDeploy/application/backend
          file: EndToEndDeploy/application/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/restaurant-backend:latest

      # 3. Build Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: EndToEndDeploy/application/frontend
          file: EndToEndDeploy/application/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/restaurant-frontend:latest

  # --- JOB 3: DEPLOY (INSTANCE REFRESH) ---
  deploy-refresh:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Refresh Auto Scaling Group
        run: |
          echo "Starting Instance Refresh for k3s-asg..."
          # This tells AWS to replace old instances with new ones (which pull the new Docker images on boot)
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name k3s-asg \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}' \