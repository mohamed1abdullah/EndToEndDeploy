apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fe-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: mohamed010/restaurant-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
      tolerations:
      - key: "fe-worker"
        operator: "Equal"
        value: "fe-worker"
        effect: "NoSchedule"