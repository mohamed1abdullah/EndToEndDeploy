name: Pipeline

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: self-hosted   

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Build Docker image
      - name: Build Docker images
        run: |
          docker build -t docker.io/mohamed010/backend-login .
          docker build -t docker.io/mohamed010/frontend-login .

      # 3️⃣ Push Docker image to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image
        run: |
          docker push mohamed010/backend-login
          docker push mohamed010/frontend-login

      # 4️⃣ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # 5️⃣ Use Minikube context
      - name: Use minikube context
        run: kubectl config use-context minikube

      # 6️⃣ Deploy Kubernetes manifests
      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/
